<div data-toast-container class="toast-container position-fixed top-0 end-0 p-3">
    <!-- Template caché pour le JS -->
    <div data-toast-template class="toast align-items-center border-0 text-white" role="alert">
        <div class="d-flex">
            <div class="toast-body" data-toast-body></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

    <!-- Pour les messages après redirection (chargement de page) -->
    {% for message in messages %}
    <div class="toast align-items-center border-0 text-white bg-{{ message.tags }}" role="alert">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
</div>
