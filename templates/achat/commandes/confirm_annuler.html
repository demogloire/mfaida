{% extends 'base.html' %}
{% block content %}
<div class="content">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-warning">
                <div class="card-header bg-warning-subtle">
                    <h5 class="mb-0 text-warning"><i class="ti ti-ban me-2"></i>Annuler la commande</h5>
                </div>
                <div class="card-body text-center py-4">
                    <p class="mb-1">Voulez-vous vraiment annuler la commande :</p>
                    <p class="fw-bold fs-5">{{ commande.numero_commande }}</p>
                    <p class="text-muted">Fournisseur : {{ commande.fournisseur.nom_societe }}</p>
                </div>
                <div class="card-footer d-flex justify-content-end gap-2">
                    <a href="{% url 'achat:detail-commande' commande.pk %}" class="btn btn-light">Retour</a>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">
                            <i class="ti ti-ban me-1"></i>Confirmer l'annulation
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
