{% comment %}Bloc de filtres date réutilisable{% endcomment %}
<form method="get" class="row g-2 align-items-end mb-4">
  {% for key, val in request.GET.items %}
    {% if key != 'debut' and key != 'fin' %}
      <input type="hidden" name="{{ key }}" value="{{ val }}">
    {% endif %}
  {% endfor %}
  <div class="col-auto">
    <label class="form-label small fw-semibold mb-1">Du</label>
    <input type="date" name="debut" value="{{ debut|date:'Y-m-d' }}" class="form-control form-control-sm">
  </div>
  <div class="col-auto">
    <label class="form-label small fw-semibold mb-1">Au</label>
    <input type="date" name="fin" value="{{ fin|date:'Y-m-d' }}" class="form-control form-control-sm">
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-funnel me-1"></i>Filtrer</button>
  </div>
  <div class="col-auto">
    <a href="?" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg me-1"></i>Réinitialiser</a>
  </div>
  {% block filtres_extra %}{% endblock %}
</form>
