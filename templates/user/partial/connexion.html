{% load widget_tweaks %}
<form hx-post="{%  url 'user:connexion' %}">
    {% csrf_token %}
    <div class="card">
        <div class="card-body p-5">
            <div class="login-userheading">
                <h3>Connectez - vous</h3>
                <h4>Accedez à votre Système de Gestion</h4>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail <span class="text-danger"> *</span></label>
                <div class="input-group">
                    {% render_field form.username class="form-control border-end-0" type="email" %}
                    <span class="input-group-text border-start-0">
                        <i class="ti ti-mail"></i>
                    </span>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe <span class="text-danger"> *</span></label>
                <div class="pass-group">
                    {% render_field form.password class="pass-inputs form-control" type="password" %}
                    <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                </div>
            </div>
            <div class="form-login authentication-check">
                <div class="row">
                    <div class="col-12 d-flex align-items-center justify-content-between">
                        <div class="custom-control custom-checkbox">
                            <label class="checkboxs ps-4 mb-0 pb-0 line-height-1 fs-16 text-gray-6">
                                {% render_field form.remember_me type="checkbox" class="form-control" %}
                                <span class="checkmarks"></span>Souvez - vous
                            </label>
                        </div>
                        <div class="text-end">
                            <a class="text-orange fs-16 fw-medium" href="{% url 'user:mot-de-passe-oublie' %}">Mot de passe oublié ?</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-login">
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </div>
        </div>
    </div>
</form>
