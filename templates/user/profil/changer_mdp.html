{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="content">
    <div class="page-header">
        <div class="page-title">
            <h4 class="fw-bold">Changer le mot de passe</h4>
            <h6>Sécurisez votre accès</h6>
        </div>
        <div class="page-btn">
            <a href="{% url 'user:mon-profil' %}" class="btn btn-outline-secondary">
                <i class="ti ti-arrow-left me-1"></i>Retour
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <form method="post"
                          hx-post="{% url 'user:changer-mot-de-passe' %}"
                          hx-target="this" hx-swap="outerHTML">
                        {% csrf_token %}
                        {% include 'user/profil/partial/form_mdp.html' %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
